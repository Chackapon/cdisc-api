name: Build Addon from main branch
on:
  push:
    branches:
      - master
  workflow_dispatch:


jobs:
  Build-Main-Branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7

      - run: npm ci

      - name: Compile TypeScript files to JavaScript
        run: npm run compile

